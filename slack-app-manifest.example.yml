display_information:
  name: TapInShift
  description: Slack attendance punch app for TapInShift cloud queue sync.
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: tapinshift
    always_online: false
oauth_config:
  scopes:
    bot:
      - "chat:write"
settings:
  event_subscriptions:
    request_url: "https://<lambda-function-url>/slack/events"
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: "https://<lambda-function-url>/slack/actions"
  socket_mode_enabled: false
  org_deploy_enabled: false
  token_rotation_enabled: false
