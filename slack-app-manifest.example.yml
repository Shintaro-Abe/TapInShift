display_information:
  name: TapInShift Local
  description: Local attendance punch app for TapInShift.
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: tapinshift
    always_online: false
oauth_config:
  scopes:
    bot:
      - "chat:write"
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
