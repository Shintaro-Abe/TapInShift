[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapinshift"
version = "0.1.0"
description = "Slack-driven local work time entry agent for password-protected Excel timesheets."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34.0",
  "python-dotenv>=1.0.1",
  "slack-bolt>=1.21.0",
  "tzdata>=2025.2",
  "xlwings>=0.31.0",
]

[project.scripts]
tapinshift-agent = "tapinshift.app:main"

[tool.setuptools.packages.find]
where = ["src"]
